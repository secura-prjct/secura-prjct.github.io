[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# El frontend llama a /api/analizar; Netlify lo envía a la función.
[[redirects]]
  from = "/api/analizar"
  to = "/.netlify/functions/analizar"
  status = 200
  force = true
